<!doctype html><html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(60% 70% at 92% 0%,rgba(242,160,61,.22),transparent 70%),#faf7ef;font-family:Arial,Helvetica,sans-serif;color:#0f3b2e;position:relative}
.pad{padding:64px 72px 0}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:24px;font-weight:700;background:#fffdf8;border:1.5px solid #dcdccb;border-radius:999px;padding:10px 24px 10px 18px}
.eyebrow i{width:14px;height:14px;border-radius:50%;background:#e8862a;display:block}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:132px;line-height:1;letter-spacing:-.04em;margin:30px 0 0}
p{font-family:Georgia,"Times New Roman",serif;font-size:38px;line-height:1.25;margin:26px 0 0}
p em{color:#a8440f}
.sky{position:absolute;left:36px;right:36px;bottom:74px;color:#0f3b2e}
.sky svg{display:block;width:100%;height:auto}
.art-fill{fill:#faf7ef}.art-sun{fill:#e8862a;opacity:.9}
.foot{position:absolute;left:0;right:0;bottom:0;height:74px;background:#0f3b2e;color:#f6f2e6;display:flex;align-items:center;justify-content:space-between;padding:0 72px;font-size:21px;font-weight:700;white-space:nowrap}
.foot span:last-child{color:#f2a03d}
</style></head><body>
<div class="pad"><span class="eyebrow"><i></i>24–25 January 2027 · New Delhi · In person</span>
<h1>India Datathon</h1></div>
<div class="sky">__SKYLINE__</div>
<div class="foot"><span>Clinical questions. Shared expertise. Hands-on health data science.</span><span>Hosted by Apollo Hospitals</span></div>
</body></html>
